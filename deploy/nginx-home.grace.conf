# Include inside the existing home.grace TLS server block.
location = /bulletin {
    return 308 /bulletin/$is_args$args;
}

location ^~ /bulletin/ {
    client_max_body_size 1m;

    # Preserve /bulletin: the application mounts itself at this prefix as well
    # as at / for direct LAN access. Do not add a trailing slash here.
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_cache off;
    proxy_next_upstream off;
}
